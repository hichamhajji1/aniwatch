name: ani
description: AnShow — Anime show. A luxurious anime discovery, watchlist, and reminder app.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  shared_preferences: ^2.5.3
  http: ^1.4.0
  url_launcher: ^6.3.1
  youtube_player_iframe: ^5.2.2
  webview_flutter: ^4.14.1
  flutter_local_notifications: ^18.0.1
  flutter_timezone: ^4.1.1
  timezone: ^0.9.4
  image_picker: ^1.2.3
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#0A0A0A"
  adaptive_icon_foreground: assets/branding/app_icon.png
  adaptive_icon_foreground_inset: 0
  web:
    generate: true
    image_path: assets/branding/app_icon.png
    background_color: "#0A0A0A"
    theme_color: "#FFC857"
  windows:
    generate: true
    image_path: assets/branding/app_icon.png
    icon_size: 256

flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.jpg
    - assets/branding/app_icon.png
    - assets/branding/poster_wall.jpg
    - assets/onboarding/jujutsu.jpg
    - assets/onboarding/cowboy.jpg
    - assets/onboarding/spirited.jpg
    - assets/posters/
